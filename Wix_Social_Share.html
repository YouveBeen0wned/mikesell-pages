<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', Arial, sans-serif;
      background: transparent;
    }
    .share-group {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      align-items: center;
      justify-content: center;
    }
    .share-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #4A5568;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(74, 85, 104, 0.35);
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .share-btn:hover {
      background: #2D3748;
      box-shadow: 0 4px 12px rgba(74, 85, 104, 0.45);
      transform: translateY(-2px) scale(1.07);
    }
    .share-btn:active {
      background: #1A202C;
      transform: translateY(0) scale(1);
      box-shadow: 0 1px 4px rgba(74, 85, 104, 0.25);
    }
    .share-btn svg {
      width: 19px;
      height: 19px;
      fill: #ffffff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="share-group">

    <!-- Facebook — links to profile page -->
    <a class="share-btn" href="https://www.facebook.com/mike.sell.963/" target="_blank" rel="noopener" title="Follow on Facebook">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987H7.898V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
      </svg>
    </a>

    <!-- LinkedIn — links to profile page -->
    <a class="share-btn" href="https://www.linkedin.com/in/48thusprez" target="_blank" rel="noopener" title="Follow on LinkedIn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>

    <!-- Twitter / X — links to profile page -->
    <a class="share-btn" href="https://twitter.com/yb0wned" target="_blank" rel="noopener" title="Follow on X / Twitter">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>

    <!-- Bluesky — share -->
    <button class="share-btn" onclick="shareOn('bluesky')" title="Share on Bluesky">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078a8.741 8.741 0 01-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.204-.659-.299-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8z"/>
      </svg>
    </button>

    <!-- Truth Social — share -->
    <button class="share-btn" onclick="shareOn('truth')" title="Share on Truth Social">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248h-3.026V18.75h-3.093V8.248H8.438V5.625h9.124v2.623z"/>
      </svg>
    </button>

    <!-- WhatsApp — share -->
    <button class="share-btn" onclick="shareOn('whatsapp')" title="Share on WhatsApp">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
    </button>

  </div>

  <script>
    var message    = 'Hi, I just found mikesell.org. This is the change we need! Check it out and let\'s vote for Mike in November!';
    var url        = 'https://www.mikesell.org';
    var encoded    = encodeURIComponent(message);
    var encodedUrl = encodeURIComponent(url);

    function shareOn(platform) {
      var link = '';
      switch(platform) {
        case 'bluesky':
          link = 'https://bsky.app/intent/compose?text=' + encoded + '%20' + encodedUrl;
          break;
        case 'truth':
          link = 'https://truthsocial.com/share?url=' + encodedUrl + '&title=' + encoded;
          break;
        case 'whatsapp':
          link = 'https://wa.me/?text=' + encoded + '%20' + encodedUrl;
          break;
      }
      if (link) window.open(link, '_blank');
    }
  </script>
</body>
</html>
