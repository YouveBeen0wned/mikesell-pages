<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Appearances</title>
<style>
@font-face{font-family:'avenir-heavy';font-style:normal;font-weight:400;src:url('https://static.parastorage.com/fonts/v2/74290729-59ae-4129-87d0-2eec3974dce1/v1/avenir-lt-w01_85-heavy1475544.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'avenir-light';font-style:normal;font-weight:400;src:url('https://static.parastorage.com/fonts/v2/af36905f-3c92-4ef9-b0c1-f91432f16ac1/v1/avenir-lt-w01_35-light1475496.woff2') format('woff2');font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;}
/* Transparent so the Wix section's own background shows through. An embed
   should not bring its own page color. */
/* Transparent, and no scrollbars of its own: this lives in a fixed-height Wix
   element, so the content is sized to fit rather than scrolled. */
html,body{background:transparent;overflow:hidden;}
body{font-family:'avenir-light',Arial,sans-serif;color:#1a1a18;}

/* Capped width. Without this the cards keep growing with the section, the
   16:9 thumbnails get taller, and no single Wix element height fits. Capped,
   the desktop height tops out and stays put. */
.vid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1000px;margin:0 auto;}

/* Below 700px the three-across grid would stack into three tall cards, roughly
   980px of page. A compact row instead — thumbnail beside the text — keeps all
   three visible in about the same height as the desktop layout, so one element
   height works nearly everywhere. */
@media(max-width:700px){
  .vid-grid{grid-template-columns:1fr;gap:10px;}
  .vid{flex-direction:row;}
  .vid-thumb{flex:0 0 132px;width:132px;}
  .vid-body{padding:9px 12px 9px 11px;justify-content:center;gap:4px;}
}

.vid{background:#fff;border:1.5px solid #e2e8f0;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow 0.18s,transform 0.18s;}
.vid.tappable{cursor:pointer;}
.vid.tappable:hover{box-shadow:0 6px 20px rgba(0,0,0,0.10);transform:translateY(-2px);}
.vid-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0b1430;overflow:hidden;}
.vid-thumb img{width:100%;height:100%;object-fit:cover;display:block;border:0;}
.vid-thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vid-play span{width:44px;height:44px;border-radius:50%;background:rgba(11,20,48,0.72);border:2px solid rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;}
.vid-play svg{margin-left:3px;}
.vid-body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1;text-align:left;}
/* Titles are clamped to two lines. Without this, a long episode title wraps to
   three or four and that card grows, which in a fixed-height embed is exactly
   what produces a scrollbar. Clamping makes every card the same height, so one
   element height always fits. */
.vid-title{font-family:'avenir-heavy',Arial,sans-serif;font-size:12.5px;line-height:1.4;color:#1a1a18;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:35px;}
.vid-meta{font-size:10px;color:#9ca3af;letter-spacing:0.03em;height:14px;}
.vid-src{font-family:'avenir-heavy',Arial,sans-serif;font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:#7C3AED;height:12px;overflow:hidden;}

.vid-more{margin-top:13px;text-align:center;}
.vid-more a{font-family:'avenir-heavy',Arial,sans-serif;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#002d5b;text-decoration:none;border-bottom:1.5px solid #59D7EE;padding-bottom:2px;}

</style>
</head>
<body>

<div class="vid-grid" id="vid-grid"></div>
<div class="vid-more" id="vid-more" style="display:none;">
  <a href="https://www.youtube.com/playlist?list=PLNsrEoxAO9cI" target="_blank" rel="noopener">See every appearance</a>
</div>

<script>
/* ---------------- configuration ----------------
   Curation is the playlist. Add an appearance to "Mike Appearances" in YouTube
   and it shows up here within half an hour, from anybody's channel, with no
   deploy and no edit to this file. Remove it there and it disappears here.

   MAX: how many to show. This is a Wix embed in a FIXED-HEIGHT iframe, so an
        unbounded grid would clip as the playlist grows. Showing the newest N
        keeps the height constant forever. 3 = one row on desktop; 6 = two
        rows (raise the Wix element height to match if you change this). */
const PLAYLIST = 'PLNsrEoxAO9cI';
const API = 'https://bloomers-phone.ccm-inspired.workers.dev/videos';
const MAX = 3;

/* Fallback, so the embed is never an empty hole in the page if the playlist is
   empty or the Worker is unreachable. Snapshot as of 2026-10-02. */
const FALLBACK = [
  { id: 'h2gVvY-Vu08', title: 'Mike Sell Sits Down With Chuck Todd | Meet the Forwardists', channel: 'YouveBeenOwned', published: '2026-09-29T23:00:22+00:00' },
  { id: 'hciHK3Xpfno', title: 'Different Parties, One Community. A Conversation with Mike Sell', channel: 'Clay County Speaks', published: '2026-09-15T00:21:34+00:00' }
];

/* Appearances that are NOT on YouTube, so cannot live in the playlist. Each
   one is pinned to a fixed slot in the wall by `pos` (1 = first card), and the
   playlist fills in around them. Substack and Spotify both allow cross-origin
   framing, so these play inline like any other card.
     pos     - 1-based slot in the finished wall
     embed   - iframe src; omit it and the card links out instead of playing
     link    - where "open the source" goes
   Add an entry here for a podcast, a Substack video, or a news segment. */
const MANUAL = [
  {
    pos: 2,
    title: 'Mike Sell Wants to Go to Congress Without a Donate Button',
    channel: 'Clay News & Views',
    published: '2026-09-19T10:02:55+00:00',
    link: 'https://www.clayviews.com/p/mike-sell-wants-to-go-to-congress',
    embed: 'https://www.clayviews.com/embed/podcast/mike-sell-wants-to-go-to-congress?autoplay=1',
    thumb: 'https://substackcdn.com/image/fetch/$s_!pAmN!,w_1200,h_600,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-video.s3.amazonaws.com%2Fvideo_upload%2Fpost%2F216384270%2F245ab712-c684-428c-a5d3-a97d0d15491b%2Ftranscoded-1789779273.png'
  }
];

/* The feed reports whichever channel uploaded the video, which is right for a
   host's show but reads oddly for Mike's own channel handle. */
const CHANNEL_ALIAS = { 'youvebeenowned': 'Mike Sell', 'mike sell for congress': 'Mike Sell' };
const label = (c) => CHANNEL_ALIAS[String(c || '').toLowerCase()] || c || 'Appearance';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

let VIDEOS = [];

/* No loading="lazy" on the thumbnails. The grid is injected with innerHTML
   after load, and in that case lazy evaluation can decide an image is
   off-screen and never re-check, leaving the card permanently blank even
   when it is plainly in view. Three images is not worth that risk. */
/* A card can be a YouTube video (identified by `id`) or anything else with its
   own embeddable player (`embed`). If it has neither, it links out. */
const embedOf = (v) => v.embed
  || (v.id ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '?autoplay=1&rel=0' : '');
const thumbOf = (v) => v.thumb
  || (v.id ? 'https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/hqdefault.jpg' : '');

function card(v, i) {
  const playable = !!embedOf(v);
  // Not playable in place, so the whole card becomes a link to the source.
  const open = playable ? '' : ` onclick="window.open('${esc(v.link || '#')}','_blank','noopener')"`;
  return `<div class="vid tappable" data-i="${i}"${open}>
    <div class="vid-thumb">
      <img src="${esc(thumbOf(v))}" alt="" onerror="this.style.display='none'">
      <div class="vid-play"><span>${playable
        ? '<svg width="15" height="17" viewBox="0 0 15 17" fill="#fff"><path d="M0 0 L15 8.5 L0 17 Z"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2"><path d="M6 2h8v8M14 2L4 12"/></svg>'
      }</span></div>
    </div>
    <div class="vid-body">
      <div class="vid-src">${esc(label(v.channel))}</div>
      <div class="vid-title">${esc(v.title || 'Untitled')}</div>
      <div class="vid-meta">${esc(when(v.published))}</div>
    </div></div>`;
}

function render() {
  $('vid-grid').innerHTML = VIDEOS.map(card).join('');
}

/* Splice the hand-pinned appearances into the playlist's own order. Each MANUAL
   entry claims its `pos` slot; the playlist items flow into whatever is left,
   keeping their relative order. Two entries wanting the same slot are placed in
   the order they appear in MANUAL rather than one silently overwriting the
   other. */
function merge(feed) {
  const out = [];
  const pinned = MANUAL.slice().sort((a, b) => (a.pos || 99) - (b.pos || 99));
  const rest = feed.slice();
  let p = 0;
  for (let slot = 1; (p < pinned.length || rest.length) && out.length < MAX; slot++) {
    if (p < pinned.length && (pinned[p].pos || 99) <= slot) out.push(pinned[p++]);
    else if (rest.length) out.push(rest.shift());
    else out.push(pinned[p++]);
  }
  return out;
}

/* Order is PLAYLIST ORDER, deliberately not date. The feed returns entries in
   playlist position, so dragging a video to the top of "Mike Appearances" in
   YouTube puts it first here, and whatever sits in the first MAX positions is
   what shows. Do not sort this — sorting would take the manual control away. */
function paint(list) {
  VIDEOS = merge(list || []).slice(0, MAX);
  render();
  $('vid-more').style.display = VIDEOS.length ? 'block' : 'none';
  sendHeight();
}

/* Plays in place. A fixed-position lightbox would be trapped inside this
   iframe and clipped by the Wix element's height, so the thumbnail is swapped
   for the player instead. */
function play(i) {
  const v = VIDEOS[i];
  if (!v) return;
  const src = embedOf(v);
  if (!src) return;   // link-out cards are handled by their own onclick
  // One at a time. Redrawing the grid resets every thumbnail, which also tears
  // down any player already running, then the new one goes in.
  render();
  const host = document.querySelector('.vid[data-i="' + i + '"]');
  if (!host) return;
  host.classList.remove('tappable');
  // Players load only after a real tap, so nothing tracks a visitor who merely
  // loaded the page. YouTube goes through youtube-nocookie.
  host.querySelector('.vid-thumb').innerHTML =
    '<iframe src="' + esc(src) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}

$('vid-grid').addEventListener('click', (e) => {
  const c = e.target.closest('.vid');
  if (c && c.dataset.i != null) play(c.dataset.i);
});

/* Never dead-end. Draw the baked-in list FIRST so something is always on the
   page, then upgrade to the live feed if it answers. A .catch() alone would
   not cover a synchronous throw (no fetch, a blocked request), which would
   leave the embed blank. */
function load() {
  paint(FALLBACK);
  try {
    fetch(API + '?list=' + encodeURIComponent(PLAYLIST))
      .then((r) => r.ok ? r.json() : Promise.reject(r.status))
      .then((d) => { if (d && d.ok && d.items && d.items.length) paint(d.items); })
      .catch(() => {});
  } catch (e) { /* fallback is already on screen */ }
}

/* Wix embeds run in a fixed-height iframe. This asks the parent to resize,
   which some Wix embed types honor; set the element height manually otherwise. */
function sendHeight(){var h=document.documentElement.scrollHeight||document.body.scrollHeight;try{window.parent.postMessage({type:'iwResizeHeight',data:{height:h}},'*');}catch(e){}}
window.addEventListener('load',sendHeight);
window.addEventListener('resize',sendHeight);

load();
</script>
</body>
</html>
