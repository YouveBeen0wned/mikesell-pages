# Mike Sell for Congress — Master FAQ
**U.S. House, Florida's 4th Congressional District | Forward Party**

Compiled September 12, 2026. Positions drawn from every candidate questionnaire, voter guide, and podcast prep completed this cycle. First person, in Mike's voice. Edit freely.

## ABOUT MIKE

**Who are you? Tell us about yourself.**
My name is Mike Sell. I was raised in a Navy family, the son and grandson of sailors, and I grew up moving from place to place, learning early the importance of living a value-based life and appreciating the multiculturalism that makes America so great. I started working in high school earning minimum wage, and I built a career in operational excellence, the work of fixing complex, broken systems and making them serve people better. Most of that work was inside the U.S. healthcare industry, where I earned my Six Sigma Black Belt and operational excellence certification. I led projects that saved more than a quarter of a billion dollars, not by cutting services, but by listening to the people doing the work and being a champion for the best ideas to cut waste and dysfunction. I have spent just as long developing diversity programs and volunteering in my community, and I founded a not-for-profit built on the belief that access to information is a right. I am a husband and a father of three grown children.

**Education.**
I originally went to school for political science, but I found my real calling in operational excellence, the work of fixing broken systems and making them serve people better. I built master's-level expertise in that field through rigorous professional certification, earning my Six Sigma Black Belt and Shingo Operational Excellence Assessor credentials, along with years of continuing training in leadership and continuous improvement.

**Occupation / professional background.**
I am a certified operational excellence professional with more than two decades spent fixing complex, broken systems, most of that work inside the U.S. healthcare industry. I have led projects that generated more than a quarter of a billion dollars in documented savings for major organizations in healthcare and human resources, not by cutting services, but by cutting the waste, redundancy, and dysfunction that drain those systems. I have sat at the executive tables where decisions affecting millions of people get made. I also spent fifteen years building organizations focused on bringing people together and widening opportunity, and I founded a not-for-profit built on the belief that access to information is a right.

**Family.**
I am a devoted husband and father. My partner and I have been together for more than two decades and raised three children, now grown and setting out on their own paths. Family is at the center of why I am running. Service runs three generations deep in my family. My grandfather served 26 years in the Navy as a Lieutenant Commander, completing four submarine tours. My father served 20 years and retired from Naval Air Station Jacksonville as an Instructor Flight Engineer on the P-3 Orion. Both of my brothers served as well, one as a Marine and one in military law enforcement and security. I grew up inside that culture of duty and sacrifice, and it shaped everything I understand about what military families carry and what this country owes the people who serve it.

**Political experience.**
I have not held elected office, and I see that as part of what I offer. My experience is on the organizing side of politics rather than the career-politician side. Over the past year I have helped lead a local Indivisible chapter, where part of my work has been finding and supporting good candidates who will fight for their communities. I have spent two decades in community and civic organizing, building coalitions and bringing people together across differences, and I completed formal training as a community organizer.

**What lessons from sports have you applied to your life and career?**
I played baseball for almost ten years and football through youth and into high school, and a lot of how I work traces back to that. Baseball especially. It is a game built on failure. The best hitters in the world fail seven times out of ten, and you learn fast that you do not get better in one big swing. You get better one at-bat, one rep, one adjustment at a time. That is the same thing I did for twenty years fixing broken systems, and it is how I am running this campaign, small, steady gains that add up. Football taught me the other half. Everyone has an assignment, and it only works if everybody does their job and trusts the person next to them. Nobody wins alone.

## WHY I'M RUNNING & THE FORWARD PARTY

**Why are you running?**
In a sense I have been preparing for this my whole life. I was raised to believe that a life should mean something, and that those who are aware and have the capacity to help carry an obligation to act. I have spent more than twenty years walking into broken systems and making them work better for the people they were supposed to serve. The political system is the largest broken system I have seen, and I reached a point where I could not keep diagnosing the problem from the outside and call that enough. I am running for my own children and for everyone else's, to leave things better than I found them.

**What is the Forward Party? Why it over D/R/NPA?**
It is a newer party, founded nationally a few years ago by Andrew Yang after his presidential run. It is less about a rigid ideology and more about fixing a broken system, things like open primaries, term limits, and ending gerrymandering, while focusing on the future instead of reactionary politics. It is an outlet for independent progressives like me who want some structure without the big-donor obligations. The two major parties are captured by money and locked in dysfunction. Forward gave me a home that matches who I am: independent, results-focused, and unbought.

**How is the Forward Party different from the DSA? Do you support the DSA?**
I respect the DSA, and we share some concerns, like corporate power crushing working people. But we are different. The DSA is explicitly democratic socialist. The Forward Party is not ideological about left or right, it is about fixing the system and solving problems. I am not a member of the DSA. The overlap is the diagnosis that the system is rigged for the powerful, not the label.

**What makes you the most qualified candidate?**
The job of a member of Congress is to find what is broken, build the coalition to fix it, and deliver a result that changes something for real people. Substance: I am running on an agenda for real change, not slogans. Vision: I approach this with an organizer's mindset, not a hero mentality. It is not about one person riding in to save the day, it is about starting with the people closest to the problem and building the solution around them. Values: I am role-modeling the kind of leadership we want. I take no corporate money and answer to no party machine, so I am free to represent this district and no one else. Experience: I have spent twenty years finding the root cause of complex problems and fixing them, saving more than a quarter of a billion dollars by cutting dysfunction rather than services. What I do not bring is decades inside a system that rewards keeping things as they are. I consider that a qualification, not a gap.

**What would you hope to be remembered for?**
I hope to be remembered as someone who helped shift the trajectory of our nation back toward something future generations can be proud of. Not one bill or one term, but a turning point, where we started fixing broken systems instead of managing their decline, and where government began answering to people again instead of money.

**Three key messages of the campaign.**
1. I take no corporate money and answer to no party machine, and I am not asking voters for a dime. All I ask is that you consider what I have to offer. My time and my loyalty belong to the people of this district, not to donors I would owe before ever taking office.
2. I learned a long time ago that the opposite of depression is expression, but words that go unheard are just as detrimental as words that go unspoken. I have spent twenty years fixing broken systems, and our politics is the most broken one I have seen. It needs someone who has been listening to the people it has stopped hearing and who already knows what needs to be done.
3. I bring a vision for a better America that we can all feel proud to contribute to, and it comes with a real plan to get there, available right now on my website. That plan means lower costs for housing, healthcare, and everyday essentials, schools that are funded, and a government that answers to the people again. I measure success by one thing: whether your life actually got better.

**How would you describe yourself politically?**
I do not fit neatly on the left-right scale, and that is on purpose. I am a Forward Party candidate, not left, not right, forward. I hold views some would call progressive, like protecting personal freedom and economic fairness, alongside views others call conservative, like cutting waste, term limits, and restraint abroad. What ties it together is a belief in results, accountability, and putting people over party.

**What action steps would you take to implement your policies?**
One member cannot do it alone, so the work is building coalitions of people who will actually vote together. I would build cross-partisan blocs, use oversight aggressively, and start with the achievable wins. Because I take no corporate money, I am free to push without asking donors' permission. A handful of aligned members who stick together can have an outsized effect.

## THE CAMPAIGN MODEL & MONEY

**What is this campaign demonstrating?**
I am running on a fraction of a normal congressional budget, with no corporate money and no party machine, and reaching voters through tools most campaigns have never tried. On my website, a voter-facing agent I built myself and personally trained to represent me answers any question, any time, in my own voice, with no handler in between. I am not asking voters for a dime. All I ask is that they consider what I have to offer.

**Have you accepted money from any PAC or special interest?**
None. Not a single dollar from any PAC, corporate donor, or special interest, environmental or otherwise. My campaign is funded entirely by individual people. This is a deliberate choice, not a circumstance. It means that when I am elected, I will owe nothing to any industry, including the polluters and utilities that spend heavily to shape policy. My only obligation is to the people of this district.

**Do you support AIPAC? Would you take their money?**
I do not take money from any PAC, corporate or otherwise, so that includes AIPAC. My campaign is funded by people. I support Israel's right to exist and its people's security, and I support an honest alliance, which means a ceasefire, the return of hostages, humanitarian access, and conditioning offensive weapons. That is not AIPAC's position, so I am not aligned with them.

**Would you refuse contributions from polluting utility companies?**
Yes. I already take no corporate money of any kind, so this is an easy pledge. Not a dollar from utility companies, their PACs, or any corporate donor. I answer to the residents paying these utility bills, not to the polluters raising them.

## THE PLATFORM (THREE PILLARS + 4Ps)

**What is your platform / what are you passionate about?**
My agenda is built on three pillars. Protect Our Future: fund public education, enact sensible gun legislation, divest from overseas conflicts, rein in exploitive technologies, and prosecute those who have broken the public's trust. Make Life More Affordable: fight for higher wages, end price gouging (rent, groceries, healthcare, prescriptions, education), tax the rich, defend body autonomy, and champion Universal Basic Income. Fix the System: get money out of politics, create fair district maps, increase accountability, and set term limits.

**The 4Ps.**
Every issue is assessed through four lenses. People asks who needs to be in the room designing the solution and who gets centered in the outcome. Process asks what systems need to change before a policy can succeed. Policy asks what the specific legislative commitment is, not the aspiration but the actual obligation. Purse asks where the money comes from, where it goes, and who benefits from the way it flows. Most platforms stop at the second question and call it a plan. I am offering a systemic solution to counteract systemic corruption.

**Top priorities if elected.**
Lower the cost of living, protect our future (schools, gun safety, technology accountability, climate), and fix the system that produces these problems by getting money out of politics.

**Cross-party issue where Washington is failing everyone.**
Cost of living. It does not matter if you vote red, blue, or neither, everybody feels it. Washington fails on it because both parties take money from the industries driving those costs up. What I would do differently is simple: I take no corporate money, so I am free to let Medicare negotiate drug prices, take on the insurance companies, and go after price gouging, because I do not owe those industries anything.

## REPRODUCTIVE RIGHTS & BODY AUTONOMY

**Do you support abortion access?**
Yes. Personal medical decisions belong to the individual, not the government. I support guaranteed access to safe and legal abortion up to viability, and beyond it when the life or health of the mother is at risk or there is a severe fetal anomaly. I support fully funded reproductive health clinics. The majority of this district voted for Amendment 4, and I agree with them.

**Reproductive issues likely to come before Congress and your positions.**
Oppose a national abortion ban in every form and work to restore the protections of Roe in federal law. Put clinicians and the people who use these services in the rooms where rules are written, and oppose FDA or HHS appointees who would choke off access. Protect medication abortion and the FDA's standing approval of it, defend the right to cross state lines for care without surveillance, and close the loophole that lets personal health and location data be sold and used against someone. Support federal codification of abortion rights, protection for contraception, and science-based reproductive health education. Fully fund Title X clinics and community health centers, protect and expand Medicaid, fund paid family and sick leave, and address the maternal mortality crisis killing Black women in Duval County at close to three times the rate of white women.

**Should abortion restrictions in Florida be stricter, less strict, or the same?**
Less strict. Florida's current ban is far more restrictive than what most people here want.

**Parental consent/notification for a minor's abortion?**
Support, held loosely. As the father of two daughters, I am grateful we never faced this, and I think most parents want to be there for their child in that moment. I do not hold this position rigidly, and I am genuinely open to hearing from advocates and families about getting the protections right so that we support healthy family involvement without putting vulnerable young people at greater risk.

**Should anti-abortion pregnancy centers get taxpayer funds?**
Oppose. Public dollars should fund medical care, not persuasion. Many of these centers are not licensed medical facilities and exist to steer people away from a legal option. I would put those dollars into licensed providers and community health centers.

**Should Planned Parenthood / Title X providers receive taxpayer funds?**
Yes. They are the front door to healthcare for millions, providing contraception, cancer screenings, and prenatal care. Federal law already bars taxpayer dollars from directly funding abortion. Defunding these providers just strips essential healthcare from the people who can least afford to lose it.

**Should IVF embryos be legally protected from destruction?**
No. Families using IVF to have children should not have the government policing their fertility treatment.

**Should the Comstock Act be enforced against abortion medication?**
Strongly disagree. Reviving a dormant 1873 law to block legal, FDA-approved medication would be a backdoor national abortion ban imposed without a vote of Congress.

## LGBTQ+ RIGHTS

**Do you support ending discrimination against the LGBTQ+ community?**
Yes. No one should lose a job, a home, healthcare, or equal treatment because of who they are or who they love. I support the Equality Act, clear federal protection against discrimination based on sexual orientation and gender identity across employment, housing, healthcare, education, and public services.

**Same-sex marriage?**
Support. Marriage equality is settled and it is right. I support keeping it protected in federal law so it cannot be stripped away by a future court or state legislature.

**Healthcare and employment rights for queer and transgender people?**
Support. That includes protecting access to gender-affirming care decided between a patient and their doctor, not politicians, and making sure no one is fired or denied treatment for their gender identity.

**LGBTQ+ youth?**
Support funding for school support programs and mental health services, legal protection from discrimination, and healthcare decisions kept between young people, their families, and their doctors. I oppose book bans and curriculum censorship that erase these students from their own classrooms.

**Is transitioning a child "child abuse"?**
Strongly disagree, and the framing is harmful. These are deeply personal medical and family decisions that belong to young people, their parents, and their doctors, guided by medical evidence.

**Transgender participation in sports and single-sex spaces?**
These are very different situations bundled into one question, and a single blanket rule does not fit them all. Every person deserves dignity and safety, including transgender Americans, and fairness in competitive sports and safety in sensitive settings also matter. Where genuine questions arise, work them out case by case, guided by fairness, safety, and expert input, not fear.

## HEALTHCARE

**Do you support Medicare for All / universal healthcare?**
My goal is guaranteed healthcare for every American, and I see Medicare for All as the most direct path there. I am also a pragmatist who spent 20 years fixing healthcare systems, so I will take real coverage gains now over a perfect bill later. Let anyone who wants public coverage have it, alongside private options. Protect Medicare and Medicaid, negotiate drug prices, and fund community health centers.

**Immediate healthcare priorities.**
Let Medicare negotiate the price of every covered drug, not a limited list. Protect and expand Medicaid with no work requirements. Fully fund community health centers in Northside and Westside Jacksonville. Confront hospital consolidation through antitrust enforcement. Close the revolving door between pharmaceutical boards and federal regulators. Insulin costs about two dollars to make and has retailed at 300; that is a policy choice, not a market failure.

**Government database of people with medical illnesses?**
Strongly disagree. The government has no business keeping a registry of people's illnesses, and framing patients as an economic burden is the wrong way to think about human beings. It would be a serious invasion of medical privacy and an open door to discrimination.

## ECONOMY, WAGES & AFFORDABILITY

**Do you support a living wage and expanding union rights?**
Yes. I support raising the federal minimum wage to a living wage a person can actually support a family on. I support a federal pay equity standard with real enforcement and the right to discuss wages without retaliation. I support extending collective bargaining rights to domestic workers, gig workers, and home health aides through a federal Domestic Workers Bill of Rights.

**Economic equity priorities.**
A living wage; real pay equity; the right to organize for excluded workers; a federal guarantee of paid family and sick leave; defending the social safety net against cuts and work requirements; federal investment in affordable housing and homelessness prevention; stronger fair-lending enforcement against predatory lending in Black and brown neighborhoods; and funding financial education and fair access to financial information. Women of color carry the steepest version of every one of these gaps, and I will weigh that in how protections and dollars are targeted.

**Do you support pay equity?**
Support. I would push for a federal pay equity standard with real enforcement, salary transparency, the right to discuss wages without retaliation, protecting the right to organize, and stronger enforcement agencies.

**Paid parental leave?**
Support. No parent should have to choose between a paycheck and caring for a new child. The United States is the only wealthy nation without a national paid leave guarantee.

**Should people who can afford it pay more in taxes?**
Strongly agree. For decades the tax burden has shifted onto working families while the wealthiest pay a smaller share than they should. Asking those who have benefited most to pay their fair share is fairness, not envy.

## HOUSING

**How would you address housing affordability?**
UNF's own research shows Jacksonville does not mainly have a housing shortage, it has a financialization problem. Wall Street and private equity are buying up homes to extract rent, and rents are up about 35 percent since 2020. I would rein that in, stop hedge funds from buying up American homes and require landlord ownership transparency so shell companies cannot hide while neglecting properties. I would take on the insurance spike pricing people out of homes they own, expand rental assistance, support community land trusts, and open a real path to first-time and first-generation ownership.

**Would you amend the Live Local Act?**
Yes, amend it. I support the goal of more affordable housing, but the current version overrides local input, drives sprawl, and defines "affordable" at income levels too high to help working families. Reform should target genuine affordability, protect local and environmental review, and take on the corporate and private-equity buyers the Act ignores.

## CLIMATE & ENVIRONMENT

**Are you a climate champion? Is climate change real?**
Yes. I treat climate as a present emergency, not a distant threat, because in Northeast Florida it already is: flooding, septic contamination in the St. Johns River, and insurance costs pricing families out of their homes. I will fight to protect our natural spaces and advance a just transition to clean, affordable energy that lowers household costs and puts the communities hit first and hardest at the center of the plan.

**Is climate change a financial threat to the economy?**
Yes, and we are paying for it now, in insurance premiums, property damage from floods, and infrastructure repair. Prevention and adaptation always cost less than disaster.

**Top climate and environmental priorities.**
Protect our water and coasts (fund Jacksonville's septic-to-sewer conversion and clean up the St. Johns River); make clean energy affordable (restore clean energy tax credits); and defend residents from costs dumped on them, whether climate-driven insurance spikes or data centers shifting their energy costs onto families. The communities hit hardest should help lead every decision.

**Should government do more or less on climate?**
More. The effects are already here in Northeast Florida. Fund the infrastructure that protects us, restore clean energy incentives that lower costs, and make sure the communities hit first and hardest help lead the planning.

**Would you repeal the "Don't Say Climate Change" law?**
Yes, I support repealing the 2024 state law that stripped climate change from Florida's statutes and energy policy. Pretending a threat does not exist by deleting the words for it leaves Florida less prepared and less safe. As a federal candidate I would fight the same impulse at the federal level, where there are ongoing efforts to strip climate science, data, and funding out of our agencies.

**AI hyperscale data centers: moratorium or ban?**
I support a moratorium on new hyperscale data centers until real guardrails are in place, not a permanent total ban. I work in technology and am not against these facilities, but I am against them being built with no accountability. Before another is approved: developers pay the true cost of the power and water they use, residential ratepayers are shielded from those costs, and there is real review of grid, water, and community impact with community consent.

**Restore environmental regulatory agencies?**
Yes. Agencies protecting our air, water, land, and climate only work when properly funded, staffed with people who believe in the mission, and held accountable to the public rather than the industries they oversee. The answer is not to eliminate them, it is to restore them, and put independent, scientifically qualified leaders in charge.

**Conservation?**
Yes. Strengthen and restore conservation laws to protect wetlands, wildlife habitat, state parks, working farms, and rural landscapes. Put scientifically qualified people in charge and restore the funding and enforcement authority of agencies like DEP, FWC, and the water management districts. Science, not the development lobby, should drive decisions about our natural resources.

**Phosphate mining and radioactive waste?**
Yes to restoring strong rules. When a company profits from extraction, it should bear the full cost of the damage it leaves behind, not pass the risk to families, drinking water, and future generations. Radioactive and toxic waste cannot be regulated loosely. The federal levers are the Clean Water Act, Safe Drinking Water Act, and EPA oversight.

**Community Redevelopment Act funds?**
Yes to amending it so funds reach the underserved communities the statute intended and go toward residents living with toxic waste and climate-disaster destruction, rather than being diverted elsewhere.

**Resiliency, insurance, and relocation of vulnerable communities?**
Yes. Reform the insurance system as part of a bigger strategy that invests in preventing damage, not just paying to clean it up. Build clean energy and conservation into resilience and recovery. Support relocation only as a last resort, when an area genuinely cannot be made safe, and only with the full involvement and consent of the people who live there.

**Insurance redlining?**
Yes to reforms ending racial and economic redlining in insurance. No family should be denied affordable, adequate coverage because of the racial makeup or income of their neighborhood. Federal levers: the National Flood Insurance Program, disaster recovery funding, and fair-lending and civil-rights enforcement.

**Transportation and emissions?**
Yes. Invest in mass transit and passenger rail, build walkable and bike-friendly communities, be smart about highway spending instead of endlessly widening roads, deploy EV charging broadly (including working-class and rural areas usually served last), and invest in safe, sustainable battery technology. Cleaner transportation cuts emissions and lowers household costs at the same time.

## ENERGY & UTILITIES

**Most reliable energy source for growing demand?**
Reliability, affordability, and independence should drive our choices, not ideology. No single source does it all. Nuclear is our most reliable always-on, carbon-free power, and we should expand it, including small modular reactors. Pair that with growing solar and wind, natural gas as a bridge, and a modernized grid that can handle rising demand from homes, industry, and data centers.

**How should utility regulators respond to rising costs and data centers?**
Stop letting ordinary customers subsidize big industrial users. Require data centers and large users to pay the true cost of the demand they add to the grid, protect residential ratepayers from pass-through costs, and demand transparency in how rate hikes get approved.

**Would you reform the Public Service Commission?**
Yes. Rates should be decided in the public interest, with transparency, incentives for conservation and clean energy, and an end to tilting the rules toward fossil fuels and overconsumption. I strongly support Floridians' right to own and benefit from the solar power they install on their own homes.

## EDUCATION

**Biggest issue in public education?**
Funding. Every child deserves a strong public school, and we cannot keep pulling money out of the public system most families rely on. Fully fund public education, pay teachers what the job is worth, and make sure every neighborhood has a school that gives its kids a real shot.

**Federal role in education (pre-K, K-12, higher ed)?**
Pre-school: invest in early childhood education and childcare. K-12: fund public schools strongly and equitably, support and pay teachers, protect students with disabilities and those in underfunded districts, and leave curriculum to local communities. Higher ed: bring down the cost of college and vocational programs, ease student debt, and expand apprenticeships and trades. Public money should strengthen public education, not be drained from it.

**Public funding for religious school vouchers?**
No. Public money belongs in public schools. Vouchers pull funding out of the public system and redirect it, often to religious schools not accountable to the public paying for them.

**Intelligent design / creationism in public school science?**
No. Public school science classes should teach science. Intelligent design and creationism are religious ideas, not scientific ones. Faith belongs in the home and the house of worship, not the science classroom.

**Should foreign governments fund American education?**
Support strong transparency and real limits. No foreign regime should buy influence over what American students learn or access sensitive research. Require full disclosure and block funding with strings attached, while still allowing legitimate academic exchange.

**Eliminate the U.S. Department of Education?**
Strongly disagree. Local communities should control curriculum, and they already do. Eliminating the department would strip funding and protections students depend on, especially kids with disabilities, students in underfunded districts, and families relying on Pell Grants and student aid.

**"Parental rights" (sex ed, gender identity, books, vaccines)?**
Parents are the most important people in a child's life and should be involved and informed. But "parental rights" should not be a banner to control what every other family's child learns or reads. Support age-appropriate, medically accurate, inclusive curriculum with the ability for a parent to opt their own child out. Oppose book bans. Support science-based school immunization requirements with legitimate medical exemptions.

## GUNS

**Do you support common-sense gun regulations?**
Yes. I respect the Second Amendment and responsible, law-abiding gun owners. Common-sense steps protect both those rights and public safety: universal background checks, red flag laws with due process, keeping guns from domestic abusers, and safe storage. These are broadly popular, even among gun owners, and do not take firearms from responsible people. The Jacksonville Landing shooting happened because the system worked exactly as designed. That has to change.

**Charleston loophole?**
Yes, close it. The loophole lets a sale proceed if a background check is not completed in three business days. That is how the Charleston church shooter got his gun. Give examiners the time they need before a sale goes through.

## IMMIGRATION

**Do you agree with current immigration enforcement?**
No. Enforcement should be humane, orderly, and focused on real threats, not sweeping and militarized. I support securing the border and enforcing the law, but the current approach leans on fear and force while the courts stay buried under a backlog.

**Immigration reforms you support.**
Fund the immigration courts to clear the backlog, pass the Dream Act, create an earned pathway for people who have lived and contributed here for years, and process asylum seekers fairly and humanely. We can enforce the law and treat people with dignity at the same time.

**Who should be allowed to immigrate?**
People who come lawfully, contribute, and follow a clear, fair process should be able to build a life here, as generations of immigrants always have. That means a real pathway for Dreamers and long-contributing residents, fair and timely asylum, work and family visas that meet the economy's needs, and enough judges to end the backlog.

**Do all people have Constitutional rights regardless of status?**
Support. The Constitution's core protections apply to persons, not only citizens, and the courts have long affirmed that due process and equal protection reach everyone on U.S. soil. A right that can be denied to one group based on status is not a guaranteed right at all.

**Sanctuary cities?**
Neutral. There is a real public safety case on both sides. Communities are safest when immigrants trust local police enough to report crimes, and local officers should focus on local public safety rather than doubling as federal immigration agents. At the same time, we must cooperate to remove anyone who commits a serious crime. The real fix is a working federal immigration system.

**Militarizing the border / troops in sanctuary cities?**
Oppose. Deploying active-duty military at detention centers and into sanctuary cities is the use of military force against the domestic population. The Posse Comitatus Act exists for a reason.

## RACIAL JUSTICE & CIVIL RIGHTS

**Racial justice issues and your positions.**
Seat the people living these conditions, and the advocates alongside them, where decisions are made, and oppose appointees who treat racial inequity as settled history. Restore and strengthen the Voting Rights Act through the John Lewis Voting Rights Advancement Act. Oppose redistricting that dilutes the voting power of Black communities. Fund community violence interruption programs led by trusted local organizations. End cash bail practices and mandatory minimums that punish poverty and fall hardest on Black and brown defendants, and support sealing and expungement for low-level offenses. Direct federal dollars at the maternal health crisis taking Black women in Duval County at close to three times the rate of white women. Back fair-lending and fair-housing enforcement against redlining and predatory lending.

**Federal reparations study commission?**
Yes. We cannot honestly address harm we have never formally accounted for. In a district where redlining and disinvestment still shape who owns a home, the legacy is not abstract.

**Do you support eliminating DEI programs?**
Oppose. I spent fifteen years building and leading these programs. Done right, they widen the door so qualified people who were historically shut out get a fair shot, and they make organizations stronger.

**Equal representation on commissions and non-elected bodies?**
Support. The people affected by a decision should be in the room where it gets made. Representation that reflects the public produces better decisions and more trust.

## VOTING RIGHTS & DEMOCRACY REFORM

**Voting rights and civics.**
Restore and strengthen the Voting Rights Act through the John Lewis Voting Rights Advancement Act. Defend vote by mail and early voting. Oppose economic barriers to voting, including requiring returning citizens to pay fines and fees before their rights are restored. Support nonpartisan, independent redistricting and Florida's Fair Districts provision. Fund accurate, nonpolitical civics education.

**Do you support the Fair District Amendments?**
Support. Voters should choose their representatives, not the other way around. I support the Fair Districts standards, independent and nonpartisan redistricting, and maps that keep real communities whole.

**Who should handle redistricting?**
An independent, nonpartisan commission. Politicians should not draw the maps that decide their own elections.

**Multi-member districts with proportional representation?**
Worth pursuing. Winner-take-all districts leave huge numbers of voters with no representation and make gerrymandering possible. Multi-member districts with proportional representation would give more communities a real voice. A serious reform worth studying and advancing.

**Documentary proof of citizenship to register (impact on women)?**
I would work to keep this kind of requirement from becoming a barrier, because it falls hardest on women whose names have changed, older citizens, and working families. If such a rule takes effect, no eligible citizen should lose their vote over paperwork or cost. Fight for free and fee-waived documents, federal funding so states provide them at no charge, mobile and online services, generous timelines, and accepting multiple forms of proof.

**Voting without photo ID?**
Every eligible citizen should be able to vote, and no one should be turned away for lacking an ID they cannot easily afford or obtain. Strict photo ID laws fall hardest on seniors, students, working families, and women whose names have changed. If any ID is required, it must be free and simple to get, and states should accept multiple reasonable forms.

**Open primaries?**
Yes, strongly. Locking independent and NPA voters out of primaries they pay for is wrong. Core to why I am a Forward candidate.

**Ranked choice voting?**
Yes. It ends the spoiler problem and gives voters real choices.

**Filibuster?**
Reform it, not eliminate it. Right now it is used to block almost everything. Bring back the talking filibuster: if you want to stop the Senate from acting, you should have to stand there and make your case out loud. Keep it as a check, end it as a kill switch.

**Electoral College?**
Reform, not abolish. Winner-take-all means a Republican in a blue state or a Democrat in a red one has a presidential vote that barely counts. Fix that so every vote carries real weight rather than throwing the whole system out overnight.

**Will you hold in-person town halls?**
Yes. Real ones, in person, regularly. Not a phone line, not a filtered Zoom. My AI agent lets any voter get a straight answer from me 24/7, but that adds to in-person access, it never replaces it.

## GOVERNMENT REFORM, SPENDING & ACCOUNTABILITY

**Proper role and limits of government?**
Government exists to do for people what they cannot do alone and to protect the rights and security of everyone, not just the powerful. It should set a floor of basic protections and public goods, then get out of the way. It has no business in a person's private life, their medical decisions, or their conscience, and it should not impose one group's religious code on everyone else or pick winners for its donors.

**Are any federal agencies unconstitutional / should be eliminated?**
None are unconstitutional. The real problem is a lack of accountability, efficiency, and transparency. I support serious reform: cutting waste, ending the revolving door between agencies and the industries they oversee, and making every agency answer to the public. I will not eliminate functions millions of families depend on, like Medicare, Medicaid, and community health centers run through HHS.

**Should government cut spending to reduce the debt?**
Agree that we should cut wasteful spending, and I have spent my career doing exactly that. But we do not fix the debt by cutting alone, and we should not gut healthcare, education, or Social Security. Cut real waste and ask those who have benefited most to pay their fair share.

**Top priorities to eliminate government waste.**
Audit the Pentagon and cut contractor fraud and bloated overhead (it has never passed a clean audit); right-size procurement so agencies buy what they need instead of mass-produced excess; close the revolving door between agencies and industry; end corporate subsidies that reward the powerful; and modernize outdated systems so services cost less and work better.

**Free enterprise and private property?**
Agree they are foundational, and I have spent my career helping businesses work better. Markets work best with fair rules and real competition, so the system rewards people who create value rather than those who rig it.

**Congress or the President, who oversees federal agencies?**
Both, by design. Congress creates agencies, sets their authority, funds them, and conducts oversight. The President carries out the laws and manages them day to day. Neither branch is supposed to have unchecked control. My concern is that real oversight has weakened, and I would work to restore it regardless of who is in the White House.

**Greatest threats to America and constitutional liberties?**
The concentration of power in hands not accountable to the people. When money buys political outcomes, government stops answering to voters. And the concentration of critical technological infrastructure (communications, financial systems, data) in a few private hands not subject to any democratic check. Both erode the accountability our liberties depend on.

**What does freedom of speech mean to you?**
It means the government cannot punish you for what you say, believe, or write, especially when you criticize those in power. It is the foundation everything else stands on, and it has to cover speech we disagree with, because a right that only protects popular opinions is not a right at all. It is not a promise that speech carries no consequences from other people, and it does not shield fraud, threats, or incitement. What it means is that the government may not silence, surveil, or retaliate against people for peaceful expression and dissent. I would defend it for everyone, including those whose views I do not share.

**Do you support the right to free speech, assembly, and peaceful protest?**
Yes, fully. The right to speak, assemble, and protest peacefully is what lets people hold power accountable, and it has driven every movement that made this country more just. That includes protecting speech and protest I personally disagree with. I am especially wary of efforts to use government power to intimidate, surveil, or punish people for peaceful dissent.

**Accountability, corruption, and impeachment (the four pillars of pro-democracy reform).**
I commit to all four: pro-impeachment, anti-corruption, anti-oligarchy, and anti-authoritarian. Those who break the public's trust must be held accountable through the process the Constitution provides. Government must answer to the people who fund it with their taxes and their labor. And unchecked power is a threat no matter who holds it. Anti-corruption and anti-oligarchy are not slogans to me; refusing all corporate money is how I live them.

**Why is confidence in Congress so low, and your role in changing it?**
People lost faith because Congress stopped working for them. Members spend a huge share of their time raising money, so they answer to donors first. Problems large majorities agree on sit unsolved because the people writing the rules benefit from the gridlock. My role is to be a different kind of representative and prove a different model works: no corporate money, reaching voters directly, and pushing the structural fixes that rebuild trust.

**Amendment 3 (homestead exemption increase + non-homestead cap)?**
Lean no. I am all for real relief for homeowners and seniors, but Amendment 3 cuts local funding with no plan to replace it, and the non-homestead piece mostly helps commercial and rental property owners, not working families. When someone proposes a tax cut, the honest question is what gets cut to pay for it.

**Home rule and preemption (repeal SB180-type laws, set minimum standards)?**
Yes. Government should set a strong floor of protections and let communities go further to protect their own residents. Preemption laws do the opposite, tying the hands of local governments. Repeal anti-environmental preemption and set clear minimum standards: phase out single-use plastics, require clean energy transitions, establish heat protections for outdoor workers, and protect green space, wildlife, and water.

**Restore/protect home rule for cities and counties?**
Support. Local communities know their own needs better than a one-size-fits-all rule from Tallahassee. Government should set a floor of rights and let communities build above it, not reach down and block them from protecting their own people.

**Impact Fee Act (blocking cost pass-through)?**
Support in principle. Those who profit from new development should bear its true costs, not shift them onto new home buyers, taxpayers, or ratepayers. Growth should pay for itself.

**Property tax elimination (state)?**
Not without a real plan for what replaces it. Property taxes fund schools, first responders, and local services. Eliminating them with no replacement guts those services or shifts the cost onto working families through a higher sales tax. Protect seniors who have paid off their homes rather than defund what the community needs.

## FOREIGN POLICY & DEFENSE

**People Over the Pentagon Act ($100B+ cut without touching pay/benefits)?**
Yes. The Pentagon has never passed a clean audit. $100 billion is a floor, not a ceiling, if done correctly. Never cut military pay or benefits. The waste is in the contractor ecosystem, over-budget weapons systems, the procurement revolving door, and bloated overhead. Right-size troop gear and outfitting instead of mass-produced excess. And there are programs we will only understand once we can look at the books; any program that lets an official walk out with millions in gold bars needs a fundamental reassessment. The audit has to happen.

**Foreign policy approach.**
American leadership through diplomacy, alliances, and soft power, not endless military intervention. Help democracies and stand with allies, but the bar for using force must be high, and Congress, not one person, must authorize it. Repeal and replace the 2001 and 2002 AUMFs with specific, time-limited, geographically bounded authorizations.

**Gaza ceasefire and conditioning weapons to Israel?**
Yes and yes. The October 7, 2023 attack was a genuine atrocity and Israel's right to respond is not in question. But the human toll cannot be reconciled with international humanitarian law. The U.S. has legal obligations under the Arms Export Control Act and the Leahy Law that are not being enforced, and that is a political choice. Unconditional support is not an alliance, it is an abdication. The path forward is a lasting ceasefire, a two-state solution, and unobstructed humanitarian aid.

**Is the U.S.–Israel relationship important?**
Yes. Israel is a longtime ally and the region's strongest democracy, and the relationship matters for security and stability. A real alliance means being an honest partner, standing with Israel while working toward a durable peace, the return of hostages, humanitarian access, and a two-state solution.

**Ukraine?**
Intensify multilateral diplomacy to end the war. Russia's invasion violated international law; that is the starting point and cannot be negotiated away. Keep European allies and Ukraine at the table, no bilateral U.S.-Moscow deal cutting Kyiv out. The goal is a just and durable peace, not a frozen line that lets Russia rearm.

**Is the CCP a threat?**
Yes, cyberattacks, IP theft, supply chain leverage, and military expansion are real. The answer is to out-compete: invest in American manufacturing, technology, and workers, protect our data and infrastructure, and stand with allies, without fearmongering or eroding our own freedoms.

**Is Islamic terrorism a threat?**
Terrorism and violent extremism are real threats, and we must confront them wherever they arise. But the enemy is violent extremism, not any faith or the millions of peaceful, patriotic Muslim Americans who are our neighbors. Much of the threat we face is fueled by our entanglement in endless foreign conflicts; when we stop being drawn into overseas wars, the danger at home shrinks considerably.

**Unauthorized strikes on Iran, Venezuela, allies?**
Oppose. The Constitution gives Congress the power to declare war. Bombing any nation without congressional authorization is an illegal act of war, regardless of which party's president orders it.

**Funding for diplomacy and soft power?**
Support. Diplomacy costs a fraction of what military engagement costs and does not leave behind the wreckage that becomes the next conflict's recruiting ground.

**Refugees, Sudan, Venezuela, North Korea.**
Asylum is a legal right under the 1951 Convention. Sudan: push for a ceasefire amid one of the worst humanitarian crises on earth. Venezuela: targeted sanctions on specific officials, not broad sanctions that punish civilians. North Korea: sustained engagement over 70 years of failed isolation.

## CANNABIS

**Marijuana legislation you have sponsored or supported.**
As a first-time candidate, I have no legislative record. My position is firm: I support federal decriminalization of marijuana and the expungement of prior records tied to it.

**End federal prohibition?**
Support. Over three dozen states have moved ahead of the federal government, and the conflict helps no one. Ending prohibition resolves it and lets states set their own policies, paired with expungement of prior records.

**Legalize physician-authorized medical cannabis?**
Support. Doctors and patients should make these decisions, not the federal government.

**Decriminalize simple possession?**
Support. No one should carry a lifelong criminal record for simple possession. True federal action means removing marijuana from the Controlled Substances Act, paired with expunging existing convictions.

**Automatic expungement of non-violent possession convictions?**
Yes. Expungement should be automatic, not something people must find a lawyer and pay to pursue. Prohibition has been enforced disproportionately against Black and brown Americans.

**Legalize and regulate adult use?**
Support. A regulated market is safer, taking marijuana off the street corner and putting it behind an age-verified counter, with products tested and labeled and kept from kids. Paired with expungement of prior convictions.

## FAITH & WORLDVIEW

**Do you attend a church or place of worship?**
No. I do not regularly attend, though I study scriptures and spiritual texts privately as part of my own search to understand the world and what we owe one another. I have deep respect for faith and the role it plays in people's lives.

**Your religious background / how you identify.**
I identify as agnostic. I do not claim certainty about questions I do not think any of us can answer with certainty. At the same time, I acknowledge that spirituality is real and meaningful in people's lives, including in my own. I respect the faith that gives other people purpose. What guides my decisions is evidence, empathy, and accountability to the people I serve.

**What role will your faith and worldview play in your public service?**
I am agnostic at heart. That gives me the freedom to operate from common human values and principles rather than any single set of religious fundamentals. My job would be to represent everyone, so my role is not to write any one belief system into law, but to let shared values like honesty, accountability, and care for the least powerful guide how I serve. I believe in the separation of church and state precisely because it protects everyone's freedom to believe as they choose.

**Is belief in God required to live an ethical life?**
No. Ethics come from empathy, from reason, and from how we treat the people around us. What makes a life ethical is accountability, care for others, and the choices you make when no one is watching, not a declaration of faith.

**Will you be a leader for nonreligious Americans?**
Yes. Equal treatment under the law does not depend on whether a person holds a religious belief. I will defend the First Amendment in both directions: the freedom to practice a faith and the freedom to hold none. I also believe we need to restore people's confidence in experts and the security of professionals to speak honestly, so we can have the fact-based debate that moves us forward. That is how a second enlightenment happens.

**Would you take your oath on the Constitution rather than a religious text?**
Yes. That is the document I would be swearing to defend, and the one that binds every American regardless of faith.

**What is separation of church and state to you?**
Government cannot establish an official religion or force anyone to follow one, and it cannot stop you from practicing your faith freely. It protects religion from government and government from any one religion, and guarantees that every American, of any faith or none, is equal before the law.

## MISCELLANEOUS POSITIONS

**Terminally ill patients' right to aid in dying?**
Yes, with appropriate safeguards. A terminally ill person of sound mind has the right to decide how much suffering they will endure. That choice belongs to them, their doctor, and their family, not the government.

**Forced service vs. religious beliefs (public accommodations)?**
Neutral / it depends. A business open to the public should not refuse to serve someone because of who they are, that is discrimination. At the same time, no one should be forced by the government to create speech that violates their conscience. The line is between denying a person equal service and compelling a specific message.

**Government protecting children online?**
Strongly agree. Protecting children from online predators and sexual exploitation is a fundamental duty and one of the clearest places everyone should agree. Strong enforcement against exploiters, real accountability for platforms that look the other way, and tools for law enforcement and parents.

**Have you ever been penalized for sexual misconduct in civil or criminal court?**
No.

**One Democratic policy you support:** Guaranteeing healthcare access, protecting and expanding Medicaid, and letting Medicare negotiate every drug price (Inflation Reduction Act's drug-price negotiation, which I would expand to all covered drugs).

**One Republican policy you support:** Congressional term limits. No one should spend thirty years turning public service into a career. I support term limits for every federal office and would co-sponsor the amendment.

**One Democratic policy you oppose:** The push, led mostly by Democrats from high-tax states, to repeal the SALT deduction cap, a tax break where most of the benefit flows to high earners. When I say the wealthiest should pay their fair share, I mean it even when my own side proposes the giveaway.

**One Republican policy you oppose:** The Medicaid cuts in the 2025 budget law the incumbent voted for, which the CBO projected could strip coverage from 10 to 16 million Americans, with Florida among the hardest hit.
