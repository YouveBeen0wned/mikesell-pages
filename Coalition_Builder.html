<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coalition Builder — Mike Sell for Congress FL-CD4</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pur:#470D67;--navy:#182742;--cyan:#59D7EE;--white:#fff;
  --bg:#F7F6F2;--card:#fff;--border:rgba(0,0,0,.10);
  --txt:#1a1a18;--txt2:#5f5e5a;--txt3:#888780;
  --pro-bg:#D4EDDA;--pro-txt:#1C4A28;
  --anti-bg:#FFDEDE;--anti-txt:#9B2226;
  --mix-bg:#FFF8DC;--mix-txt:#7B6914;
  --fed-bg:#E8F0FE;--fed-txt:#1A56DB;
  --fl-bg:#FFF0E0;--fl-txt:#B45309;
  --jax-bg:#EDE9FE;--jax-txt:#5B21B6;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0F1117;--card:#1A1F2E;--border:rgba(255,255,255,.10);
    --txt:#F0EDE8;--txt2:#A8A49E;--txt3:#666360;
    --pro-bg:#1C3A22;--pro-txt:#6EE7A0;
    --anti-bg:#3A1A1A;--anti-txt:#FCA5A5;
    --mix-bg:#2A2510;--mix-txt:#FCD34D;
    --fed-bg:#1A2040;--fed-txt:#93C5FD;
    --fl-bg:#2A1A00;--fl-txt:#FCD34D;
    --jax-bg:#1E1040;--jax-txt:#C4B5FD;
  }
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=League+Gothic&display=swap');

/* ── TOP BAR ── */
.topbar{background:var(--navy);padding:0 20px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:100}
.logo{font-family:'League Gothic',sans-serif;font-size:22px;letter-spacing:.04em;color:var(--white);white-space:nowrap}
.logo span{color:var(--cyan)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.counts{font-size:11px;color:rgba(255,255,255,.5)}

/* ── CONTROLS ── */
.controls{background:var(--navy);border-top:1px solid rgba(255,255,255,.08);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:52px;z-index:99}
.seg-bar{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.seg-btn{padding:5px 16px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.seg-btn.on{background:var(--pur);color:#fff}
.srch{flex:1;min-width:160px;max-width:280px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px}
.srch::placeholder{color:rgba(255,255,255,.35)}
select.fsel{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);font-size:12px;cursor:pointer}
select.fsel option{background:var(--navy);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px 4px;min-height:0}
.chip-row:empty{display:none}
.act-chip{padding:3px 10px;border-radius:20px;background:var(--pur);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.rc-bar{font-size:11px;color:rgba(255,255,255,.45);margin-left:auto;white-space:nowrap}

/* ── ISSUE PILLS ── */
.pill-bar{padding:10px 20px 0;display:flex;flex-wrap:wrap;gap:6px}
.ipill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--txt2);font-size:11px;cursor:pointer;transition:all .15s}
.ipill:hover,.ipill.on{background:var(--pur);color:#fff;border-color:var(--pur)}

/* ── GRID ── */
.main{padding:16px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
.empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.ei{font-size:36px;margin-bottom:12px}

/* ── ORG CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.org-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.org-logo{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--pur),var(--navy));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff;flex-shrink:0;object-fit:cover;text-transform:uppercase}
.org-logo-img{width:42px;height:42px;border-radius:8px;flex-shrink:0;object-fit:cover;display:block}
.org-name{font-size:13px;font-weight:600;color:var(--txt);line-height:1.3}
.scope-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px}
.sc-local{background:#E8F0FE;color:#1A56DB}.sc-state{background:#FFF0E0;color:#B45309}.sc-national{background:#EDE9FE;color:#5B21B6}.sc-research{background:#F0FDF4;color:#166534}
.org-desc{font-size:12px;color:var(--txt2);line-height:1.5;margin-bottom:10px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{font-size:10px;padding:2px 8px;border-radius:12px;background:rgba(24,39,66,.08);color:var(--navy);border:1px solid rgba(24,39,66,.18)}
.cfoot{display:flex;gap:6px;margin-top:auto}
.btn{padding:5px 12px;border-radius:6px;border:none;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
.bp{background:var(--pur);color:#fff}.bp:hover{opacity:.88}
.bg-btn{background:rgba(0,0,0,.06);color:var(--txt2)}.bg-btn:hover{background:rgba(0,0,0,.10)}

/* ── BILL CARDS ── */
.card-bill{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.bill-level{font-size:10px;font-weight:600;padding:5px 14px;letter-spacing:.06em;text-transform:uppercase}
.lv-Federal{background:var(--fed-bg);color:var(--fed-txt)}
.lv-Florida{background:var(--fl-bg);color:var(--fl-txt)}
.lv-Jacksonville{background:var(--jax-bg);color:var(--jax-txt)}
.bill-body{padding:14px}
.bill-badges{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.alg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.alg-PRO{background:var(--pro-bg);color:var(--pro-txt)}
.alg-ANTI{background:var(--anti-bg);color:var(--anti-txt)}
.alg-MIXED{background:var(--mix-bg);color:var(--mix-txt)}
.cause-pill{font-size:10px;padding:2px 8px;border-radius:12px;background:rgba(24,39,66,.08);color:var(--navy);border:1px solid rgba(24,39,66,.18)}
.bill-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px;line-height:1.3}
.bill-num{font-size:11px;color:var(--txt3);margin-bottom:8px}
.bill-status{font-size:11px;font-weight:500;color:var(--txt2);margin-bottom:8px}
.bill-plain{font-size:12px;color:var(--txt2);line-height:1.55;font-style:italic;margin-bottom:10px;border-left:2px solid var(--border);padding-left:8px}
.bill-sponsor{font-size:11px;color:var(--txt3);margin-bottom:10px}
.bill-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
.btn-sm{padding:4px 10px;border-radius:5px;border:none;font-size:10px;font-weight:500;cursor:pointer}
.btn-contact{background:var(--pur);color:#fff}.btn-contact:hover{opacity:.88}
.btn-source{background:rgba(0,0,0,.06);color:var(--txt2)}.btn-source:hover{background:rgba(0,0,0,.10)}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(560px,95vw);max-height:85vh;overflow-y:auto;padding:28px}
.modal h3{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--txt)}
.modal .sub{font-size:12px;color:var(--txt3);margin-bottom:16px}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.modal-row:last-child{border:none}
.modal-row .k{color:var(--txt3);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;flex:0 0 120px}
.modal-row .v{color:var(--txt);text-align:right;flex:1}
.close-btn{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--txt3);cursor:pointer}
.modal-wrap{position:relative}

@media(prefers-color-scheme:dark){
  .chip,.cause-pill{background:rgba(89,215,238,.10);color:var(--cyan);border-color:rgba(89,215,238,.25)}
}
</style>
</head>

const ISSUES = [...new Set([...ORGS.flatMap(o=>o.issue_areas||[]),...BILLS.map(b=>b.cause)])].sort();
const EMO = {'Healthcare & Drugs':'💊','Gun Safety':'🛡️','Climate & Infrastructure':'🌿','Technology & AI':'🤖','Economic Justice & UBI':'💰','Housing & Insurance':'🏠','Democracy & Voting':'🗳️','Education & Workforce':'📚','Immigration':'🌎','Criminal Justice':'⚖️','Body Autonomy':'🔐','LGBTQ+ Rights':'🏳️‍🌈','Veterans':'🎖️','Small Business':'🏪','Disability Rights':'♿','Mental Health & Addiction':'🧠','Campaign Finance':'💼','Body Autonomy & Personal Freedom':'🔐'};

let SEG='orgs', ACT_ISSUE='', CONN_ORG=null, DETAIL_ORG=null;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scls(scope){return 'sc-'+(scope||'local').toLowerCase()}
function getInitials(name){
  const parts=(name||'').replace(/[^a-zA-Z\s]/g,' ').split(/\s+/).filter(Boolean);
  if(parts.length===0)return'?';
  if(parts.length===1)return parts[0].slice(0,2).toUpperCase();
  return(parts[0][0]+(parts[1][0]||'')).toUpperCase();
}
function logoH(o,sz){
  const w=sz||42;
  const ini=getInitials(o.name);
  const fs=Math.round(w*.34);
  const initialsDiv=`<div class="org-logo" style="width:${w}px;height:${w}px;font-size:${fs}px;border-radius:8px">${ini}</div>`;
  // Try to get a logo URL: prefer explicit logo, then derive from website domain
  let imgSrc='';
  if(o.logo&&o.logo.startsWith('http')){
    imgSrc=o.logo;
  } else if(o.url&&o.url.startsWith('http')){
    try{
      const domain=new URL(o.url).hostname;
      imgSrc=`https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    }catch(e){}
  }
  if(imgSrc){
    return`<div style="position:relative;width:${w}px;height:${w}px;flex-shrink:0;border-radius:8px;overflow:hidden">`+
      `<div class="org-logo" style="position:absolute;inset:0;font-size:${fs}px;border-radius:0">${ini}</div>`+
      `<img src="${imgSrc}" style="position:absolute;inset:0;width:${w}px;height:${w}px;object-fit:contain;background:#fff;padding:4px;border-radius:8px;box-sizing:border-box" onerror="this.style.display='none'" loading="lazy">`+
      `</div>`;
  }
  return initialsDiv;
}
function initials(name,sz=42){
  const w=sz||42;
  return`<div class="org-logo" style="width:${w}px;height:${w}px;font-size:${Math.round(w*.34)}px">${getInitials(name)}</div>`;
}

function init(){
  buildIssueSelect();
  buildPills();
  render();
}

function buildIssueSelect(){
  const sel=document.getElementById('isel');
  ISSUES.forEach(ia=>{
    const o=document.createElement('option');
    o.value=ia; o.textContent=(EMO[ia]||'')+ ' ' +ia;
    sel.appendChild(o);
  });
}

function buildPills(){
  const bar=document.getElementById('pills');
  bar.innerHTML='';
  ISSUES.forEach(ia=>{
    const p=document.createElement('button');
    p.className='ipill'+(ACT_ISSUE===ia?' on':'');
    p.textContent=(EMO[ia]||'')+' '+ia;
    p.onclick=()=>{ACT_ISSUE=ACT_ISSUE===ia?'':ia;buildPills();render();};
    bar.appendChild(p);
  });
}

function setSeg(name,btn){
  SEG=name;
  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const isBills=(name==='bills');
  document.getElementById('lvlsel').style.display=isBills?'':'none';

  document.getElementById('ssel').style.display=isBills?'none':'';
  render();
}

function render(){
  const q=document.getElementById('srch').value.toLowerCase().trim();
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  if(SEG==='bills'){
    renderBills(q,grid);
  } else {
    renderOrgs(q,grid);
  }
}

function renderOrgs(q,grid){
  const scope=document.getElementById('ssel').value;
  let items=ORGS.filter(o=>{
    if(scope && o.scope!==scope) return false;
    if(ACT_ISSUE && !(o.issue_areas||[]).includes(ACT_ISSUE)) return false;
    if(q){const h=[o.name,o.description,...(o.issue_areas||[])].join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  document.getElementById('rc').textContent=items.length+' orgs';
  document.getElementById('rc2').textContent='';
  if(!items.length){grid.innerHTML='<div class="empty"><div class="ei">🔍</div><p>No orgs match — try clearing a filter.</p></div>';return;}
  items.forEach(o=>grid.appendChild(makeOrg(o)));
}

function renderBills(q,grid){
  const lvl=document.getElementById('lvlsel').value;
  let items=BILLS.filter(t=>{
    if(lvl && t.level!==lvl) return false;
    if(ACT_ISSUE && t.cause!==ACT_ISSUE) return false;
    if(q){const h=[t.name,t.sponsor,t.cause,t.notes,t.plain,t.status,t.num].join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });

  // Counts
  const pro=items.filter(t=>(t.alignment||'').toUpperCase()==='PRO').length;
  const anti=items.filter(t=>(t.alignment||'').toUpperCase()==='ANTI').length;
  const mix=items.filter(t=>(t.alignment||'').toUpperCase()==='MIXED').length;
  document.getElementById('rc').textContent=items.length+' bills';
  document.getElementById('rc2').textContent=`✅ ${pro}  ❌ ${anti}  ⚠️ ${mix}`;

  if(!items.length){grid.innerHTML='<div class="empty"><div class="ei">🔍</div><p>No bills match — try clearing a filter.</p></div>';return;}

  // Group by level then cause
  const levels=['Federal','Florida','Jacksonville'];
  const byLevel={};
  items.forEach(t=>{
    const lv=t.level||'Federal';
    if(!byLevel[lv]) byLevel[lv]=[];
    byLevel[lv].push(t);
  });

  levels.forEach(lv=>{
    if(!byLevel[lv]) return;
    // Level header
    const hdr=document.createElement('div');
    hdr.style.cssText='grid-column:1/-1;padding:10px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);border-bottom:1px solid var(--border);margin-bottom:2px';
    const dots={'Federal':'🏛️','Florida':'🌴','Jacksonville':'🌉'};
    hdr.textContent=`${dots[lv]||''} ${lv}  (${byLevel[lv].length})`;
    grid.appendChild(hdr);

    // Group by cause within level
    const byCause={};
    byLevel[lv].forEach(t=>{
      const c=t.cause||'Other';
      if(!byCause[c]) byCause[c]=[];
      byCause[c].push(t);
    });
    Object.entries(byCause).forEach(([cause,bills])=>{
      bills.forEach(t=>grid.appendChild(makeBillCard(t)));
    });
  });
}

function makeOrg(o){
  const el=document.createElement('div'); el.className='card card-org';
  const chips=(o.issue_areas||[]).slice(0,3).map(i=>`<span class="chip">${EMO[i]||''} ${esc(i)}</span>`).join('')+(( o.issue_areas||[]).length>3?`<span class="chip">+${(o.issue_areas||[]).length-3}</span>`:'');
  const connectBtn=o.url?`<a href="${o.url}" target="_blank" rel="noopener" class="btn bp" style="text-decoration:none">Connect →</a>`:'';
  el.innerHTML=`<div class="org-hd">${logoH(o,42)}<div class="org-meta"><div class="org-name">${esc(o.name)}</div><span class="scope-tag ${scls(o.scope)}">${esc(o.scope)}</span></div></div><div class="org-desc">${esc(o.description||'')}</div><div class="chips">${chips}</div><div class="cfoot">${connectBtn}<button class="btn bg-btn" onclick="openModal('${esc(o.id)}')">Details</button></div>`;
  return el;
}

function makeBillCard(t){
  const el=document.createElement('div'); el.className='card card-bill';
  const al=(t.alignment||'MIXED').toUpperCase();
  const alLabel={'PRO':'✅ PRO','ANTI':'❌ ANTI','MIXED':'⚠️ MIXED'}[al]||al;
  const contactBtn=t.email&&t.email.includes('@')?
    `<a href="mailto:${esc(t.email)}" class="btn-sm btn-contact">✉ Contact</a>`:
    t.email&&t.email.startsWith('http')?
    `<a href="${esc(t.email)}" target="_blank" class="btn-sm btn-contact">✉ Contact</a>`:'';
  const srcBtn=t.url?`<a href="${esc(t.url)}" target="_blank" class="btn-sm btn-source">↗ Source</a>`:'';
  el.innerHTML=`
    <div class="bill-level lv-${esc(t.level||'Federal')}">${esc(t.level||'Federal')}</div>
    <div class="bill-body">
      <div class="bill-badges">
        <span class="alg alg-${al}">${alLabel}</span>
        <span class="cause-pill">${EMO[t.cause]||''} ${esc(t.cause||'')}</span>
      </div>
      <div class="bill-name">${esc(t.name||'')}</div>
      <div class="bill-num">${esc(t.num||'')}&nbsp;&nbsp;${t.year||''}</div>
      <div class="bill-status">${esc(t.status||'')}</div>
      ${t.plain?`<div class="bill-plain">${esc(t.plain)}</div>`:''}
      <div class="bill-sponsor">Sponsor: ${esc(t.sponsor||'—')}</div>
      <div class="bill-foot">${contactBtn}${srcBtn}</div>
    </div>`;
  return el;
}

function openModal(id){
  const o=ORGS.find(x=>x.id===id); if(!o) return;
  const body=document.getElementById('orgModalBody');
  const rows=[
    ['Type',o.type||'—'],['Scope',o.scope||'—'],
    ['Issues',(o.issue_areas||[]).join(', ')||'—'],
    ['Contact',o.contact_name||'—'],
    ['Email',o.contact_email?`<a href="mailto:${o.contact_email}">${esc(o.contact_email)}</a>`:'—'],
    ['Phone',o.contact_phone||'—'],
    ['Website',o.url?`<a href="${o.url}" target="_blank">${esc(o.url)}</a>`:'—'],
    ['District',o.district||'—'],
  ].filter(([,v])=>v&&v!=='—');
  body.innerHTML=`<h3>${esc(o.name)}</h3><p class="sub">${esc(o.description||'')}</p>`+
    rows.map(([k,v])=>`<div class="modal-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  document.getElementById('orgModal').classList.add('open');
}
function closeModal(){document.getElementById('orgModal').classList.remove('open');}

window.addEventListener('DOMContentLoaded', init);
</script>
